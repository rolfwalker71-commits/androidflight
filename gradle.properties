org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.defaults.buildfeatures.buildconfig=true

# Optional Foojay auto-provision if a task ever requests a toolchain.
# Compile tasks use the running Gradle JVM (JBR 21 is fine; bytecode is 17).
# Machine path: gradle-local.properties (gitignored; see the .example file).
# Auto-detect scans ~/.jdks on Windows (C:\Users\<user>\.jdks) — that is the
# reliable JDK 17 home for Android Studio, not Foojay.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.fromEnv=JAVA_HOME,JDK17,JAVA_HOME_17
